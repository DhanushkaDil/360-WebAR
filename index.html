<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>360 AR Experience</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<style>
  :root { --accent:#ffffff; --bg:rgba(15,15,20,.65); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#000; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; display:none; }
  a-scene { position:fixed; inset:0; z-index:1; }
  .ui { position:fixed; z-index:10; color:#fff; }
  #top { top:calc(env(safe-area-inset-top) + 12px); left:12px; right:12px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #title { background:var(--bg); backdrop-filter:blur(10px); padding:8px 14px; border-radius:999px; font-size:14px; font-weight:600; max-width:55%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .btns { display:flex; gap:8px; }
  button { background:var(--bg); backdrop-filter:blur(10px); color:#fff; border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  button.on { background:#fff; color:#111; }
  #bottom { bottom:calc(env(safe-area-inset-bottom) + 12px); left:0; right:0; display:flex; flex-direction:column; gap:10px; align-items:center; }
  #blend { display:none; background:var(--bg); backdrop-filter:blur(10px); padding:8px 14px; border-radius:999px; font-size:12px; align-items:center; gap:10px; }
  #blend input { width:140px; }
  #thumbs { display:flex; gap:10px; overflow-x:auto; padding:4px 12px; max-width:100%; scrollbar-width:none; }
  #thumbs::-webkit-scrollbar { display:none; }
  .thumb { flex:0 0 auto; width:84px; height:56px; border-radius:10px; background-size:cover; background-position:center; border:2px solid transparent; opacity:.8; cursor:pointer; position:relative; }
  .thumb.active { border-color:var(--accent); opacity:1; }
  #loader { position:fixed; inset:0; z-index:20; background:#0b0b10; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; transition:opacity .4s; }
  #loader.hide { opacity:0; pointer-events:none; }
  #start { padding:14px 28px; font-size:16px; background:#fff; color:#111; }
  #msg { font-size:13px; opacity:.7; text-align:center; padding:0 24px; max-width:420px; }
  #spin { width:34px; height:34px; border:3px solid rgba(255,255,255,.25); border-top-color:#fff; border-radius:50%; animation:s 1s linear infinite; display:none; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<video id="cam" playsinline muted autoplay></video>

<a-scene vr-mode-ui="enabled: true" device-orientation-permission-ui="enabled: false"
         renderer="alpha: true; antialias: true; colorManagement: true" background="transparent: true" embedded="false">
  <a-assets timeout="30000"></a-assets>
  <a-sky id="sky" material="shader: flat; side: back; transparent: true; opacity: 1"></a-sky>
  <a-entity id="rig" position="0 0 0">
    <a-camera id="camera" look-controls="reverseMouseDrag: false; touchEnabled: true; magicWindowTrackingEnabled: false" wasd-controls-enabled="false"></a-camera>
  </a-entity>
</a-scene>

<div id="top" class="ui">
  <div id="title">360 Experience</div>
  <div class="btns">
    <button id="btnGyro">Gyro</button>
    <button id="btnAR">AR</button>
    <button id="btnFs">⛶</button>
  </div>
</div>

<div id="bottom" class="ui">
  <label id="blend">See-through <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.6"></label>
  <div id="thumbs"></div>
</div>

<div id="loader">
  <h2 style="margin:0">360 AR Experience</h2>
  <p id="msg">Tap start, then move your phone around to look inside the scene. Use <b>AR</b> to blend it with your camera.</p>
  <div id="spin"></div>
  <button id="start">Start</button>
</div>

<script>
/* ============ EDIT THIS: your 360 images ============
   Put files in an /images folder in the repo (equirectangular 2:1, ideally ≤ 4096×2048 for mobile).
   `thumb` is optional (small preview); if omitted, the full image is used. */
const SCENES = [
  { title: "Scene 1", 	src: "image/1.png"},
  { title: "Scene 2",	src: "image/2.png"},
  { title: "Scene 3",	src: "image/3.png"}
];
/* ==================================================== */

const $ = id => document.getElementById(id);
const sky = $('sky'), cam = $('camera'), video = $('cam'), scene = document.querySelector('a-scene');
let current = -1, gyroOn = false, arOn = false, stream = null;

// thumbnails
SCENES.forEach((s, i) => {
  const d = document.createElement('div');
  d.className = 'thumb';
  d.style.backgroundImage = `url('${s.thumb || s.src}')`;
  d.title = s.title;
  d.onclick = () => loadScene(i);
  $('thumbs').appendChild(d);
});

function loadScene(i) {
  if (i === current) return;
  current = i;
  document.querySelectorAll('.thumb').forEach((t, k) => t.classList.toggle('active', k === i));
  $('title').textContent = SCENES[i].title;
  $('spin').style.display = 'block';
  const img = new Image();
  img.onload = () => {
    if (current !== i) return;
    sky.setAttribute('material', 'src', SCENES[i].src);
    $('spin').style.display = 'none';
  };
  img.onerror = () => {
    $('spin').style.display = 'none';
    $('msg').textContent = 'Could not load ' + SCENES[i].src + ' — check the file path/name in the repo.';
    $('loader').classList.remove('hide');
  };
  img.src = SCENES[i].src;
}

// gyroscope ("magic window")
async function setGyro(on) {
  if (on && typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== 'granted') { alert('Motion access denied. Enable it in Safari settings to use gyro.'); return; }
    } catch (e) { console.warn(e); return; }
  }
  gyroOn = on;
  cam.setAttribute('look-controls', 'magicWindowTrackingEnabled', on);
  $('btnGyro').classList.toggle('on', on);
}
$('btnGyro').onclick = () => setGyro(!gyroOn);

// AR mode: live camera behind a see-through 360 layer
async function setAR(on) {
  if (on) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      video.srcObject = stream;
      video.style.display = 'block';
      await video.play().catch(() => {});
    } catch (e) {
      alert('Camera access is needed for AR mode (and the page must be served over HTTPS).');
      return;
    }
    if (!gyroOn) await setGyro(true);
    $('blend').style.display = 'flex';
    sky.setAttribute('material', 'opacity', parseFloat($('opacity').value));
  } else {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    video.style.display = 'none';
    $('blend').style.display = 'none';
    sky.setAttribute('material', 'opacity', 1);
  }
  arOn = on;
  $('btnAR').classList.toggle('on', on);
}
$('btnAR').onclick = () => setAR(!arOn);
$('opacity').oninput = e => sky.setAttribute('material', 'opacity', parseFloat(e.target.value));

// fullscreen
/*$('btnFs').onclick = () => {
  const el = document.documentElement;
  if (!document.fullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen || (()=>{})).call(el);
  else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
};*/

// start (user gesture needed for iOS motion permission)
$('start').onclick = async () => {
  const isTouch = matchMedia('(pointer:coarse)').matches;
  if (isTouch) await setGyro(true);
  $('loader').classList.add('hide');
};

function init() { loadScene(0); }
if (scene.hasLoaded) init(); else scene.addEventListener('loaded', init);
</script>
</body>
</html>
